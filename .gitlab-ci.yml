image: hashicorp/terraform:1.9.0

stages:
  - validate
  - compliance
  - trigger_tfe

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

.terraform_env:
  before_script:
    - terraform --version

.trigger_tfe_env:
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl jq

.nonprod_account_a_changes:
  rules:
    - changes:
        - envs/nonprod/**/*
        - config/nonprod/account-a.tfvars
        - modules/**/*
        - policies/**/*
        - scripts/**/*
        - .gitlab-ci.yml

.nonprod_account_b_changes:
  rules:
    - changes:
        - envs/nonprod/**/*
        - config/nonprod/account-b.tfvars
        - modules/**/*
        - policies/**/*
        - scripts/**/*
        - .gitlab-ci.yml

.nonprod_account_c_changes:
  rules:
    - changes:
        - envs/nonprod/**/*
        - config/nonprod/account-c.tfvars
        - modules/**/*
        - policies/**/*
        - scripts/**/*
        - .gitlab-ci.yml

# Personal / learning account (Phase-by-phase implementation on PI-00001 branch)
.nonprod_account_personal_changes:
  rules:
    - changes:
        - envs/nonprod/**/*
        - config/nonprod/account-personal.tfvars
        - modules/**/*
        - policies/**/*
        - scripts/**/*
        - .gitlab-ci.yml

.prod_account_c_eastus_changes:
  rules:
    - changes:
        - envs/prod/**/*
        - config/prod/account-c-eastus.tfvars
        - modules/**/*
        - policies/**/*
        - scripts/**/*
        - .gitlab-ci.yml

