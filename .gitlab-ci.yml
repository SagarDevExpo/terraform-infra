trigger_tfe_nonprod_account_a:
  extends: .trigger_tfe_env
  stage: trigger_tfe
  script:
    - ./scripts/trigger-tfe-run.sh "$TFE_WORKSPACE_ID_NONPROD_ACCOUNT_A" "GitLab ${CI_PIPELINE_ID} triggered nonprod account-a run for ${CI_COMMIT_SHA}"
  needs:
    - compliance_nonprod_account_a
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - envs/nonprod/**/*
        - config/nonprod/account-a.tfvars
        - modules/**/*
        - policies/**/*
        - scripts/**/*
        - .gitlab-ci.yml

