        - envs/prod/**/*
        - config/prod/account-d-westus2.tfvars
        - modules/**/*
        - policies/**/*
        - scripts/**/*
        - .gitlab-ci.yml

.prod_account_c_governance_changes:
  rules:
    - changes:
        - envs/governance/**/*
        - config/governance/prod/account-c-dr.tfvars
        - terraform-enterprise-config/**/*
        - .gitlab-ci.yml

.prod_account_d_governance_changes:
  rules:
    - changes:
        - envs/governance/**/*
        - config/governance/prod/account-d-dr.tfvars
        - terraform-enterprise-config/**/*
        - .gitlab-ci.yml

validate_nonprod:
  extends: .terraform_env
  stage: validate
  script:
    - terraform fmt -check -recursive
    - cd envs/nonprod
    - terraform init -backend=false
    - terraform validate
  rules:
    - changes:
        - envs/nonprod/**/*
        - config/nonprod/**/*
        - modules/**/*
        - policies/**/*
        - scripts/**/*
        - .gitlab-ci.yml

validate_prod:
  extends: .terraform_env
  stage: validate
  script:
    - terraform fmt -check -recursive
    - cd envs/prod
    - terraform init -backend=false
    - terraform validate
  rules:
    - changes:
        - envs/prod/**/*
        - config/prod/**/*
        - modules/**/*
        - policies/**/*
        - scripts/**/*
        - .gitlab-ci.yml

validate_governance:
  extends: .terraform_env
  stage: validate
  script:
    - terraform fmt -check -recursive
    - cd envs/governance
    - terraform init -backend=false
    - terraform validate
  rules:
    - changes:
        - envs/governance/**/*
        - config/governance/prod/**/*
        - terraform-enterprise-config/**/*
        - .gitlab-ci.yml

compliance_nonprod_account_a:
  extends:
    - .terraform_env
    - .nonprod_account_a_changes
  stage: compliance
  script:
    - ./scripts/validate-compliance-for-approval.sh nonprod envs/nonprod config/nonprod/account-a.tfvars
  needs:
    - validate_nonprod

compliance_nonprod_account_b:
  extends:
    - .terraform_env
    - .nonprod_account_b_changes
  stage: compliance
  script:
    - ./scripts/validate-compliance-for-approval.sh nonprod envs/nonprod config/nonprod/account-b.tfvars
  needs:
    - validate_nonprod

